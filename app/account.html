<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aurelia — Account settings</title>
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/variant.css">
<script src="/variant.js"></script>
</head>
<body data-page="account">
<main class="shell page">

  <h1 style="font-size:26px">Account settings</h1>
  <p class="muted">Signed in as marta.l@example.com</p>

  <div class="grid grid--sidebar" style="margin-top:22px">
    <nav class="panel">
      <ul style="list-style:none;margin:0;padding:0;font-size:14px">
        <li style="padding:7px 0;font-weight:600">Profile</li>
        <li style="padding:7px 0"><a href="/orders.html">Orders</a></li>
        <li style="padding:7px 0"><a href="/order-status.html">Deliveries</a></li>
        <li style="padding:7px 0"><a href="/help.html">Payment methods</a></li>
        <li style="padding:7px 0"><a href="/help.html">Notifications</a></li>
        <li style="padding:7px 0"><a href="/help.html">Close account</a></li>
      </ul>
    </nav>

    <div>
      <div class="settings-card">
        <h2 style="font-size:16px">Profile details</h2>
        <div class="field">
          <label for="dn">Display name</label>
          <input class="form-input" id="dn" value="Marta Lindqvist">
        </div>
        <div class="field">
          <label for="ea">Email address</label>
          <input class="form-input" id="ea" type="email" value="marta.l@example.com">
        </div>
        <div class="field">
          <label for="ph">Mobile</label>
          <input class="form-input" id="ph" value="+31 6 2841 9930">
        </div>
        <div class="field">
          <label for="sz">Default size (EU)</label>
          <select class="form-input form-input--select" id="sz"><option>43</option></select>
        </div>
        <button class="btn btn--primary" style="margin-top:4px">Save changes</button>
      </div>

      <p class="muted" style="font-size:13px;margin-top:14px">
        Changes to your email require re-verification.
      </p>
    </div>
  </div>

</main>
<script src="/js/layout.js"></script>
</body>
</html>
