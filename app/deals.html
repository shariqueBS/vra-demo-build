<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aurelia — Deals</title>
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/variant.css">
<script src="/variant.js"></script>
</head>
<body data-page="deals">
<main class="shell page">

  <div class="promo">
    <img data-demo-src="images.promo" alt="Seasonal promotion">
  </div>

  <div class="section-head">
    <h1 style="font-size:26px">This week's deals</h1>
    <span class="muted" style="font-size:13.5px">Ends Sunday 23:59 CET</span>
  </div>

  <div class="grid grid--4">
    <article class="product-card">
      <div class="product-card__media"><img src="/img/shoe-olive.svg" alt="Trail 3 Olive"></div>
      <div class="product-card__body">
        <p class="product-card__title">Aurelia Trail 3 — Olive</p>
        <p class="product-card__meta">Was $164.00</p>
        <span class="product-card__price">$98.40</span>
      </div>
    </article>
    <article class="product-card">
      <div class="product-card__media"><img src="/img/shoe-sand.svg" alt="Everyday Sand"></div>
      <div class="product-card__body">
        <p class="product-card__title">Everyday Knit — Sand</p>
        <p class="product-card__meta">Was $118.00</p>
        <span class="product-card__price">$82.60</span>
      </div>
    </article>
    <article class="product-card">
      <div class="product-card__media"><img src="/img/shoe-mint.svg" alt="Recovery Mint"></div>
      <div class="product-card__body">
        <p class="product-card__title">Recovery Slide — Mint</p>
        <p class="product-card__meta">Was $64.00</p>
        <span class="product-card__price">$44.80</span>
      </div>
    </article>
    <article class="product-card">
      <div class="product-card__media"><img src="/img/shoe-plum.svg" alt="Road 2 Plum"></div>
      <div class="product-card__body">
        <p class="product-card__title">Aurelia Road 2 — Plum</p>
        <p class="product-card__meta">Was $139.00</p>
        <span class="product-card__price">$97.30</span>
      </div>
    </article>
  </div>

</main>
<script src="/js/layout.js"></script>
</body>
</html>
