<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aurelia — Sign in</title>
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/variant.css">
<script src="/variant.js"></script>
</head>
<body data-page="login">
<main class="shell page">

  <div class="login-wrap">
    <div class="login-card">
      <h1 style="font-size:22px;text-align:center">Sign in to Aurelia</h1>
      <p class="muted" style="text-align:center;font-size:13.5px">Members get early access to every drop.</p>

      <div class="field" style="margin-top:20px">
        <label for="em">Email</label>
        <input class="form-input" id="em" type="email" value="marta.l@example.com">
      </div>
      <div class="field">
        <label for="pw">Password</label>
        <input class="form-input" id="pw" type="password" value="••••••••••">
      </div>

      <button class="btn btn--primary btn--block" style="margin-top:6px">Sign in</button>

      <p style="text-align:center;font-size:13.5px;margin:14px 0 0">
        <a href="/help.html">Forgot your password?</a>
      </p>
      <p style="text-align:center;font-size:13.5px;margin:8px 0 0" class="muted">
        New here? <a href="/help.html">Create an account</a>
      </p>
    </div>
  </div>

</main>
<script src="/js/layout.js"></script>
</body>
</html>
